[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-risk"
version = "0.1.0"
description = "Pure-Python portfolio risk & analytics engine (VaR/CVaR, Monte-Carlo, stress, optimisation, compliance)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["risk", "portfolio", "var", "monte-carlo", "finance", "quant"]
authors = [{ name = "ATLAS contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
    "Operating System :: OS Independent",
]
# Zero runtime dependencies — the whole engine is standard library.
dependencies = []

[project.urls]
Homepage = "https://github.com/Rbrewer8963/claude-skills-llm-council/tree/main/atlas"
Source = "https://github.com/Rbrewer8963/claude-skills-llm-council"

[project.scripts]
atlas = "atlas.cli:main"

[tool.setuptools]
packages = ["atlas"]

[tool.setuptools.package-data]
atlas = ["py.typed"]
